name: Submit an adaptation or workshop
description: Propose an example for inclusion on the Systems Card Game website
title: "[Example submission]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing your experience with the Systems Card Game!

        Use this form to propose an adaptation, workshop, course or other application for inclusion on our website.

        This issue and all files attached to it will be publicly visible. Please do not include consent forms, participant lists, private contact details or other confidential information.

        You do not need to understand the structure of the repository. The maintainers will organise the submitted material and prepare the web pages with you.

        Please be aware that by sharing material through this repository, you agree to that material being altered and reused by others. 

  - type: markdown
    attributes:
      value: |
        ## What are you documenting?

        An **adaptation** is a reusable version of the card set developed for a particular system, livelihood, place or topic.

        A **workshop** is a particular event, course or activity in which a card set was used.

        You may submit:

        - an adaptation without a workshop;
        - one or more workshops using an adaptation or card set that is already available; or
        - an adaptation together with one or more associated workshops.

        You only need to complete the sections and documentation templates that apply to your submission. Please tell us below what you are going to document.

  - type: dropdown
    id: submission-type
    attributes:
      label: Type of submission
      description: What would you like to document?
      options:
        - An adaptation or card set
        - A workshop, course or event
        - Both an adaptation and an associated workshop
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Adaptation or card set

        Complete this section only if you are submitting documentation for an adaptation or card set. If you are only documenting a workshop using an existing card set, you may leave this section blank.

  - type: input
    id: adaptation-title
    attributes:
      label: Adaptation or card-set title
      description: Leave this blank if you are not submitting an adaptation.
      placeholder: "Example: Reindeer Husbandry Operational Environment"
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Short summary
      description: |
        In two to four sentences, describe the adaptation and why it may be useful to others.
      placeholder: This adaptation was developed to...
    validations:
      required: true


  - type: upload
    id: adaptation-documentation
    attributes:
      label: Adaptation documentation
      description: |
        Attach a completed adaptation template if you are documenting an adaptation or card set.

        You may use either the Word template or the online Markdown template. You do not need to provide both formats. The templates are available on the [Documentation templates page](https://hmatthes.github.io/systems-card-game/downloads/documentation-templates/).
    validations:
      required: false     

  - type: markdown
    attributes:
      value: |
        ## Workshop, course or event

        Complete this section if you are submitting one or more workshops, courses or events. You do not need to document the card set again if it is already available.

  - type: textarea
    id: workshop-titles
    attributes:
      label: Workshop or course title(s)
      description: Leave this blank if you are not submitting a workshop. List each workshop separately if you are submitting more than one.
      placeholder: |
        - Workshop title
        - Additional workshop title
    validations:
      required: false

  - type: input
    id: card-set-used
    attributes:
      label: Card set used in the workshop
      description: |
        Give the name of the adaptation or card set used. If it is already documented online, please also provide a link. It does not need to have been adapted specifically for this workshop.
      placeholder: "Example: Reindeer Husbandry Operational Environment"
    validations:
      required: false

  - type: upload
    id: workshop-documentation
    attributes:
      label: Workshop documentation
      description: |
        Attach one completed workshop template for each workshop, course or event you would like to document.

        You may use either the Word template or the online Markdown template. You do not need to provide both formats. The templates are available on the [Documentation templates page](https://hmatthes.github.io/systems-card-game/downloads/documentation-templates/).
    validations:
      required: false



  - type: upload
    id: materials
    attributes:
      label: Materials for publication
      description: |
        Upload any card sets, facilitation guidelines, reports or other files that you would like us to publish. Please upload only material intended for public access.
    validations:
      required: false

  - type: textarea
    id: material-description
    attributes:
      label: Description of the materials
      description: |
        List the uploaded files and briefly explain what each contains. Include the language of each file where relevant.
      placeholder: |
        - cards-english.pdf — printable English card set
        - facilitation-guide.pdf — workshop instructions
    validations:
      required: false

  - type: upload
    id: images
    attributes:
      label: Images
      description: |
        Upload one or more images that could be used on the example page. Images are optional. Do not upload consent forms here.
    validations:
      required: false

  - type: textarea
    id: image-information
    attributes:
      label: Image captions, descriptions and credits
      description: |
        For each image, provide a caption, a short description for people who cannot see the image, and the photographer or other required credit.
      placeholder: |
        image-name.jpg
        Caption:
        Image description:
        Photographer/credit:
    validations:
      required: false

  - type: textarea
    id: contributors
    attributes:
      label: Contributors and acknowledgements
      description: |
        List the developers, organisers, facilitators, translators, funders and other people or organisations that should be credited.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References and links
      description: |
        Provide any relevant publications, reports, project pages, DOIs or other links.
    validations:
      required: false

  - type: textarea
    id: public-contact
    attributes:
      label: Public contact information
      description: |
        Optional. Provide a contact name, institution and preferred public contact method. Only include an email address if that person has agreed to have it displayed publicly.
      placeholder: |
        Name:
        Institution:
        Public email, profile or website:
    validations:
      required: false

  - type: checkboxes
    id: publication-permission
    attributes:
      label: Permission to publish
      description: Please confirm the following statements.
      options:
        - label: I own the submitted material or have permission from the relevant rightsholders to submit it for publication in this public repository and website.
          required: true
        - label: I understand that the maintainers will confirm the applicable reuse or licensing terms with me before publication.
          required: true
        - label: I have not included consent forms, participant lists, private contact details or other confidential information.
          required: true
        - label: Any images I submitted may be published online, and the necessary permissions from the photographer, rightsholder and recognizable people have been obtained.
          required: true
        - label: I am aware that material I provide here may be used and adapted by others.
          required: true  

  - type: checkboxes
    id: documentation-confirmation
    attributes:
      label: Documentation included
      options:
        - label: I have attached adaptation documentation, workshop documentation, or both.
          required: true        

  - type: markdown
    attributes:
      value: |
        The person or organisation submitting photographs should retain the underlying consent records. Please do not upload those records to GitHub.

        After receiving the submission, the maintainers will check the material, contact you through this issue if anything is missing, prepare the website pages and ask you to review substantial editorial changes before publication.